services:
  - type: web
    name: quantlens-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: python -m pip install uv && uv sync --locked --no-dev
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port "$PORT" --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quantlens-db
          property: connectionString
      - key: OPENBLAS_NUM_THREADS
        value: "1"

databases:
  - name: quantlens-db
    plan: free
    region: singapore
    databaseName: quantlens
    ipAllowList: []
