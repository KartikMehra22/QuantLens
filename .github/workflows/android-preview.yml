name: Android preview APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Optional default backend URL (can also be configured inside the app)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_APP_VARIANT: preview
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo prebuild --platform android --no-install
      # Expo's generated debug signing key is suitable for an internal semester demo only.
      - run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: quantlens-preview-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
