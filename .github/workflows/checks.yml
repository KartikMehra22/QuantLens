name: QuantLens checks
on: [push, pull_request]
jobs:
  backend:
    strategy:
      matrix:
        database: [sqlite, postgresql]
    env:
      QUANTLENS_TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg://quantlens:local-test-only@localhost:5432/quantlens_test' || '' }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quantlens
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: quantlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantlens -d quantlens_test"
          --health-interval 3s --health-timeout 3s --health-retries 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check app tests migrations
      - run: uv run pytest -q
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo export --platform web
